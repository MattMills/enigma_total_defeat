name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run on the self-hosted hippo runners; pull requests from forks run on GitHub-hosted
# ubuntu-latest instead, so outside code never runs on hippo. The runners' job-started hook
# cleans the workspace, so checkouts use `clean: false`; pip's cache persists on the runner.
jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","hippo"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # A per-job venv: the runner's interpreter is shared by every job it runs.
      - name: Python venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # The package itself is pure standard library; only the test runner is needed.
      - name: Install dependencies
        run: pip install --prefer-binary pytest

      - name: Run unit tests (fast)
        run: python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run end-to-end attack test (slow)
        run: python -m pytest -q -m slow
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Demo attack run
        run: python scripts/run_attack.py
        env:
          PYTHONPATH: ${{ github.workspace }}
